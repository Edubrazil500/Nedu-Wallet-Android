project_id = "nedu-wallet"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 900
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = true
enable_confirmations = true

[functions.account-me]
verify_jwt = true

[functions.health]
verify_jwt = false

[functions.profile-update]
verify_jwt = true

[functions.resolve-account]
verify_jwt = true

[functions.create-virtual-account]
verify_jwt = true

[functions.link-existing-virtual]
verify_jwt = true

[functions.syn-virtual-payments]
verify_jwt = true

[functions.flutterwave-webhook]
verify_jwt = false

[functions.transfer--money]
verify_jwt = true

[functions.swap-wallet]
verify_jwt = true
