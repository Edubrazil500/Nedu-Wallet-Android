databases:
  - name: nedu-wallet-db
    plan: basic-1gb
    databaseName: nedu_wallet
    user: nedu_wallet_app
services:
  - type: web
    name: nedu-wallet-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run prisma:generate && npm run build
    preDeployCommand: npm run prisma:migrate
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: nedu-wallet-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: FLW_LIVE_ENABLED
        value: "false"
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
