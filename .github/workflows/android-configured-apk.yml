name: Build Configured Android APK

on:
  push:
    branches:
      - feature/read-only-live-supabase-release
    paths:
      - '.github/workflows/android-configured-apk.yml'
      - 'NeduWallet-Android/**'
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "Type BUILD_CONFIGURED_APK to build using the configured Supabase project"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.confirm_build == 'BUILD_CONFIGURED_APK' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate public Supabase app configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing GitHub Actions secret SUPABASE_URL}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY}"
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL must be the HTTPS URL of the existing Supabase project"; exit 1 ;;
          esac
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|eyJ*) 
              if [[ "$SUPABASE_PUBLISHABLE_KEY" == sb_secret_* ]]; then
                echo "::error::A Supabase secret key must never be placed in an Android app"; exit 1
              fi
              ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build configured debug APK
        working-directory: NeduWallet-Android
        run: |
          gradle --no-daemon :app:assembleDebug \
            -PsupabaseUrl="$SUPABASE_URL" \
            -PsupabasePublishableKey="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload configured APK
        uses: actions/upload-artifact@v4
        with:
          name: nedu-wallet-android-configured
          path: NeduWallet-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
