name: Deploy Supabase Backend

# Production deployment is intentionally blocked while the proposed schema
# is incompatible with the existing iOS Supabase project. Re-enable only after
# an existing-project migration and staging verification are approved.
on:
  workflow_dispatch:
    inputs:
      acknowledge_block:
        description: "Type BLOCKED to confirm this workflow is intentionally disabled"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deployment-blocked:
    if: ${{ inputs.acknowledge_block == 'BLOCKED' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment hold
        run: |
          echo "::error::Supabase deployment is blocked pending existing-project schema compatibility review."
          echo "Do not deploy the current foundation migration or account-me function to the live iOS project."
          echo "See supabase/EXISTING_PROJECT_COMPATIBILITY.md for the required remediation and release gates."
          exit 1
