name: Android CI

on:
  pull_request:
    paths:
      - "NeduWallet-Android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile Android app
        working-directory: NeduWallet-Android
        run: gradle --no-daemon :app:assembleDebug
