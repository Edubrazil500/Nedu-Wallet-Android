name: Android CI

on:
  push:
    branches:
      - feature/functional-account-backend
    paths:
      - "NeduWallet-Android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "NeduWallet-Android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile Android app
        working-directory: NeduWallet-Android
        run: |
          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"
            if gradle --no-daemon --refresh-dependencies :app:assembleDebug; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Dependency download/build failed; retrying in 20 seconds..."
              sleep 20
            fi
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nedu-wallet-android-debug
          path: NeduWallet-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
