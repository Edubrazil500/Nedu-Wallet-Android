name: Supabase Backend CI
on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-ci.yml"
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-ci.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.58.5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Supabase configuration
        run: supabase --workdir . config validate
      - name: Format Edge Functions
        run: deno fmt --check supabase/functions
      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/health/index.ts
          deno check supabase/functions/account-me/index.ts
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply database migrations
        run: supabase db reset --local
      - name: Test database behavior
        run: supabase test db --local
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
